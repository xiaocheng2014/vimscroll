name: VimScroll
options:
  bundleIdPrefix: com.xiaocheng
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  VimScroll:
    type: application
    platform: macOS
    sources:
      - path: VimScroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaocheng.VimScroll
        PRODUCT_NAME: VimScroll
        INFOPLIST_FILE: VimScroll/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - VimScrollTests
  VimScrollTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VimScrollTests
    dependencies:
      - target: VimScroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaocheng.VimScrollTests
        GENERATE_INFOPLIST_FILE: YES
